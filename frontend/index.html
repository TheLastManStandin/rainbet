<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#151833" />
    <title>Mines</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="wordmark" href="/">
        <img src="/assets/diamond-final.png" alt="" />
        <span>BestCasino</span>
      </a>
      <div class="header-actions">
        <div class="balance-pill" aria-live="polite">
          <span class="balance-label" id="account-name">Гость</span>
          <strong id="balance-value">—</strong>
        </div>
        <button class="header-button" id="top-up" type="button">Пополнить</button>
        <button class="header-button is-primary" id="change-user" type="button">Войти</button>
      </div>
    </header>

    <main class="mines-container">
      <aside class="game-side-bar-container">
        <div class="bet-type-toggle">
          <div class="live-tabs" id="bet-mode" role="tablist">
            <button class="live-tab is-active" data-mode="manual" role="tab" aria-selected="true" type="button">Ручной</button>
            <button class="live-tab" data-mode="auto" role="tab" aria-selected="false" type="button">Авто</button>
          </div>
        </div>

        <div class="bet-control-container" id="bet-controls">
          <div class="label-heading">
            <div class="label"><span>Сумма ставки</span></div>
          </div>
          <div class="bet-amount-field">
            <span class="field-currency">$</span>
            <input id="bet-amount" inputmode="decimal" type="text" value="0.00" />
            <div class="amount-actions">
              <button id="bet-half" type="button">1/2</button>
              <button id="bet-double" type="button">2x</button>
            </div>
          </div>
          <p class="input-error" id="input-error" role="alert"></p>

          <div class="label-heading">
            <div class="label"><span>Размер сетки</span></div>
          </div>
          <div class="grid-size-tabs" id="grid-options" role="radiogroup" aria-label="Размер сетки">
            <button class="grid-size-tab is-active" data-grid-size="25" role="radio" aria-checked="true" type="button">25</button>
            <button class="grid-size-tab" data-grid-size="36" role="radio" aria-checked="false" type="button">36</button>
            <button class="grid-size-tab" data-grid-size="49" role="radio" aria-checked="false" type="button">49</button>
            <button class="grid-size-tab" data-grid-size="64" role="radio" aria-checked="false" type="button">64</button>
          </div>

          <div class="label-heading">
            <div class="label"><span>Количество мин</span></div>
          </div>
          <div class="mines-slider-container" id="mines-slider">
            <div class="item-icon gem">
              <img src="/assets/diamond-final.png" alt="" />
              <span class="gem-count" id="gem-count">17</span>
            </div>
            <div class="bar-content-container">
              <div class="bar-background"></div>
              <div class="bar-content">
                <div class="color-bar-container">
                  <div class="color-bar bottom-bar"></div>
                  <div class="color-bar top-bar" id="mines-top-bar"></div>
                </div>
                <div class="drag-button" id="mines-thumb">
                  <span class="grab-icon">
                    <span></span><span></span><span></span>
                  </span>
                </div>
                <input class="mines-range" id="mine-count" type="range" min="1" max="24" step="1" value="8" aria-label="Количество мин" />
              </div>
            </div>
            <div class="item-icon bomb">
              <span class="bomb-count" id="bomb-count">8</span>
              <span class="bomb-icon-slider"><img src="/assets/bomb.svg" alt="" /></span>
            </div>
          </div>

          <div class="auto-field is-hidden" id="auto-field">
            <div class="label-heading">
              <div class="label"><span>Количество ставок</span></div>
            </div>
            <div class="bet-amount-field">
              <input id="auto-rounds" inputmode="numeric" type="text" value="10" />
              <span class="field-suffix">∞ = 0</span>
            </div>
          </div>

          <div class="current-profit-container is-hidden" id="profit-container">
            <div class="profit-amount">
              <div class="profit-item current">
                <span class="profit-label">Текущая прибыль</span>
                <span id="profit-current">$0.00</span>
              </div>
              <div class="arrow-container">
                <svg xmlns="http://www.w3.org/2000/svg" width="6" height="10" fill="none" viewBox="0 0 6 10"><path stroke="#E8E5FF" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.75" stroke-width="1.588" d="M1 8.5l3.75-3.75L1 1"/></svg>
              </div>
              <div class="profit-item">
                <span class="profit-label">Прибыль след. раунда</span>
                <span id="profit-next">$0.00</span>
              </div>
            </div>
            <div class="multiplier-amount">
              <div class="multiplier-item current"><span id="multiplier-current">1.00x</span></div>
              <div class="vertical-line"></div>
              <div class="multiplier-item"><span id="multiplier-next">1.00x</span></div>
            </div>
          </div>

          <button class="bet-button" id="place-bet" type="button">
            <span id="place-bet-label">Ставка</span>
          </button>
        </div>
      </aside>

      <section class="game-display-container">
        <div class="game-display-header">
          <div class="game-title">
            <span class="info-icon" aria-hidden="true">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="7" stroke="#7179A5" stroke-width="1.4"/><path d="M8 7v4.2" stroke="#7179A5" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="4.9" r="1" fill="#7179A5"/></svg>
            </span>
            <img class="title-bomb" src="/assets/bomb.svg" alt="" />
            <span>Mines</span>
          </div>
          <div class="fair-badge">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 1.2l5.4 2.1v4.3c0 3.2-2.2 6.1-5.4 7.2-3.2-1.1-5.4-4-5.4-7.2V3.3L8 1.2z" fill="#7DD933"/><path d="M5.6 8.1l1.7 1.7 3.3-3.4" stroke="#151833" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>Честная игра</span>
          </div>
        </div>

        <div class="mines-game-content" id="game-content">
          <div class="tile-select-notification" id="tile-notice">
            <div class="notification-text"><span>Выберите плитки для автоигры</span></div>
          </div>
          <div class="mines-grid mines-grid-25" id="mines-board" role="grid" aria-label="Поле Mines"></div>
          <div class="mines-result is-hidden" id="win-display">
            <div class="win-result-content">
              <div class="background-icon"><img src="/assets/diamond-final.png" alt="" /></div>
              <div class="multiplier-container"><span class="multiplier" id="win-multiplier">1.00x</span></div>
              <div class="divider"></div>
              <span class="win-amount" id="win-amount">$0.00</span>
            </div>
          </div>
        </div>

        <div class="game-display-footer">
          <button class="footer-button" id="sound-toggle" type="button" aria-label="Звук">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M4 6.8h2.4L9.6 4v10L6.4 11.2H4V6.8z" fill="#7179A5"/><path class="sound-wave" d="M12 6.4a3.6 3.6 0 010 5.2M14 4.6a6.2 6.2 0 010 8.8" stroke="#7179A5" stroke-width="1.4" stroke-linecap="round"/></svg>
          </button>
          <span class="footer-wordmark">BestCasino</span>
        </div>
      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <div class="auth-overlay is-hidden" id="auth-overlay" role="dialog" aria-modal="true" aria-labelledby="auth-title">
      <div class="auth-card">
        <div class="auth-diamond"><img src="/assets/diamond-final.png" alt="" /></div>
        <h2 id="auth-title">Вход в игру</h2>
        <p>Введите данные аккаунта, чтобы продолжить.</p>
        <form id="auth-form">
          <label>
            Логин
            <input id="auth-username" autocomplete="username" required type="text" />
          </label>
          <label>
            Пароль
            <input id="auth-password" autocomplete="current-password" required type="password" />
          </label>
          <button class="bet-button" type="submit"><span>Продолжить</span></button>
        </form>
        <p class="auth-error" id="auth-error" role="alert"></p>
      </div>
    </div>

    <script src="/app.js" defer></script>
  </body>
</html>
